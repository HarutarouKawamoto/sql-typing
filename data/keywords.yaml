# 用語辞典。問題で初めて使うキーワードを、その問題と同じ作業で足す。
# 形：src/schema/keyword-schema.js
- word: SELECT
  english: 選ぶ・選び出す
  meaning: 結果に出す列を選ぶ（* は全部の列）
  example: SELECT name, price
  level: 1
- word: FROM
  english: 〜から
  meaning: どのテーブルから読むかを決める。実行は FROM から始まる
  example: FROM products
  level: 1
- word: AS
  english: 〜として
  meaning: 結果の列に別の名前を付ける（左が元の列、右が新しい名前）
  example: SELECT name AS item
  level: 1
- word: WHERE
  english: 〜のところで・〜の場合に
  meaning: 条件に合う行だけを残す。FROM の次に実行される
  example: WHERE price >= 1000
  level: 1
- word: AND
  english: そして・かつ
  meaning: 2つの条件の両方に合う行だけを残す
  example: WHERE category = 'kitchen' AND stock < 5
  level: 1
- word: OR
  english: または
  meaning: 2つの条件のどちらかに合えば残す
  example: WHERE stock = 0 OR supplier IS NULL
  level: 1
- word: IN
  english: 〜の中に
  meaning: かっこの中に並べた値のどれかと同じなら残す（OR をまとめた書き方）
  example: WHERE category IN ('kitchen', 'bag')
  level: 1
- word: BETWEEN
  english: 〜の間に
  meaning: 2つの値の間（両端を含む）にあれば残す。小さい方を先に書く
  example: WHERE price BETWEEN 500 AND 2000
  level: 1
- word: LIKE
  english: 〜のような
  meaning: 文字の形で探す。% は「何文字でもよい」の印
  example: WHERE name LIKE '%Mug%'
  level: 1
- word: IS NULL
  english: 空である
  meaning: 値が入っていない（NULL の）行を残す。= NULL では見つからない
  example: WHERE supplier IS NULL
  level: 1
- word: IS NOT NULL
  english: 空ではない
  meaning: 値が入っている行だけを残す
  example: WHERE supplier IS NOT NULL
  level: 1
- word: ORDER BY
  english: 〜の順に並べる
  meaning: 行を並べ替える。何も書かなければ小さい順（ASC）
  example: ORDER BY price DESC
  level: 1
- word: DESC
  english: descending（下りの）
  meaning: ORDER BY で大きい順・新しい順に並べる
  example: ORDER BY price DESC
  level: 1
- word: ASC
  english: ascending（上りの）
  meaning: ORDER BY で小さい順・古い順に並べる（書かなくても同じ）
  example: ORDER BY price ASC
  level: 1
- word: LIMIT
  english: 限り・上限
  meaning: 結果を先頭から決めた行数だけにする。ORDER BY のあとに実行される
  example: LIMIT 5
  level: 1
- word: DISTINCT
  english: はっきり区別された・別々の
  meaning: 同じ値の行を1つにまとめる
  example: SELECT DISTINCT category
  level: 1
# ここから中級
- word: COUNT
  english: 数える
  meaning: 行の数を数える。count(*) は全部の行、count(列) はその列が NULL でない行
  example: SELECT count(*) FROM products
  level: 2
- word: SUM
  english: 合計
  meaning: 列の値を足し合わせる
  example: SELECT sum(stock) FROM products
  level: 2
- word: MAX
  english: 最大（maximum）
  meaning: 列のいちばん大きい値
  example: SELECT max(price) FROM products
  level: 2
- word: AVG
  english: 平均（average）
  meaning: 列の値の平均
  example: SELECT avg(price) FROM products
  level: 2
- word: GROUP BY
  english: 〜ごとにまとめる
  meaning: 同じ値の行を1つのグループにまとめ、グループごとに集計する
  example: GROUP BY category
  level: 2
- word: HAVING
  english: 〜を持っている
  meaning: 集計したあとのグループを、条件で絞り込む（WHERE は集計の前の行を絞る）
  example: HAVING count(*) >= 3
  level: 2
- word: JOIN
  english: つなぐ・結合する
  meaning: 2つのテーブルの行を、ON の条件でつないで1行にする（相手のない行は消える）
  example: JOIN customers c ON c.id = o.customer_id
  level: 2
- word: 'ON'
  english: 〜の上で・〜について
  meaning: JOIN で、どの行どうしをつなぐかの条件
  example: ON c.id = o.customer_id
  level: 2
- word: LEFT JOIN
  english: 左を残してつなぐ
  meaning: 左のテーブルの行は全部残し、相手のない行は右の列を NULL にする
  example: customers c LEFT JOIN orders o ON o.customer_id = c.id
  level: 2
- word: CASE
  english: 場合
  meaning: 条件ごとに違う値を出す。WHEN・THEN・ELSE・END と一緒に使う
  example: CASE WHEN price >= 5000 THEN 'high' ELSE 'low' END
  level: 2
- word: WHEN
  english: 〜のとき
  meaning: CASE の中で、条件を書く
  example: WHEN price >= 5000 THEN 'high'
  level: 2
- word: THEN
  english: そのときは
  meaning: CASE の中で、WHEN の条件に合ったときの値
  example: WHEN price >= 5000 THEN 'high'
  level: 2
- word: ELSE
  english: それ以外は
  meaning: CASE の中で、どの WHEN にも合わなかったときの値
  example: ELSE 'low'
  level: 2
- word: END
  english: 終わり
  meaning: CASE の終わり
  example: CASE WHEN price >= 5000 THEN 'high' ELSE 'low' END
  level: 2
- word: TO_CHAR
  english: 文字に（to character）
  meaning: 日付や数を、決めた形の文字にする。'YYYY-MM' なら 2026-08 のような年と月
  example: to_char(ordered_at, 'YYYY-MM')
  level: 2
- word: INSERT INTO
  english: 〜の中に入れる
  meaning: テーブルに新しい行を足す。列の並びと VALUES の値の並びを合わせる
  example: INSERT INTO customers (name, region) VALUES ('Kei Mori', 'south')
  level: 2
- word: VALUES
  english: 値
  meaning: INSERT で足す行の値を、列の並びと同じ順に書く
  example: VALUES ('Kei Mori', 'south')
  level: 2
- word: UPDATE
  english: 新しくする・更新する
  meaning: テーブルの行の値を書き換える。WHERE を付けないと全部の行が変わる
  example: UPDATE products SET price = 0 WHERE id = 3
  level: 2
- word: SET
  english: 決める・置く
  meaning: UPDATE で、どの列をどの値にするかを書く
  example: SET price = price * 9 / 10
  level: 2
- word: DELETE
  english: 消す
  meaning: テーブルの行を消す。WHERE を付けないと全部の行が消える
  example: DELETE FROM order_items WHERE order_id = 5
  level: 2
- word: WITH
  english: 〜を使って・〜と一緒に
  meaning: 問い合わせの結果に名前を付け、後ろの SELECT で表のように使う（CTE）。同じ途中の結果を何度も使える
  example: WITH valid_orders AS (SELECT id FROM orders) SELECT count(*) FROM valid_orders
  level: 3
- word: OVER
  english: 〜にわたって
  meaning: 集計や順位の関数を、行をまとめずに行ごとに計算する（ウィンドウ関数）。() の中で、計算する範囲と順を決める
  example: sum(sales) OVER (ORDER BY month)
  level: 3
- word: PARTITION BY
  english: 仕切る・分ける
  meaning: OVER の中で、計算するまとまりを列の値で分ける。GROUP BY と違い、行は1行にまとまらない
  example: rank() OVER (PARTITION BY category ORDER BY price DESC)
  level: 3
- word: RANK
  english: 順位・ランク
  meaning: OVER の ORDER BY の順に、1から順位を付ける。同じ値の行は同じ順位になる
  example: rank() OVER (ORDER BY price DESC)
  level: 3
- word: CREATE INDEX
  english: 索引を作る
  meaning: 列に索引（インデックス）を作る。その列で探すとき、全部の行を読まずに目的の行へ行ける
  example: CREATE INDEX ON access_logs (session_id)
  level: 3
- word: CREATE TABLE
  english: 表を作る
  meaning: 新しいテーブルを、列の名前・型・制約を決めて作る
  example: CREATE TABLE coupons (code TEXT PRIMARY KEY)
  level: 3
- word: PRIMARY KEY
  english: 主な鍵
  meaning: 行を1つに決める列（主キー）。同じ値と NULL は入れられない
  example: code TEXT PRIMARY KEY
  level: 3
- word: NOT NULL
  english: NULL ではない
  meaning: その列に NULL（空っぽ）を入れられないようにする制約
  example: expires_on DATE NOT NULL
  level: 3
- word: CHECK
  english: 確かめる
  meaning: 入れる値が条件に合うかを確かめる制約。合わない値の INSERT・UPDATE はエラーになる
  example: CHECK (discount BETWEEN 1 AND 50)
  level: 3
- word: FOR UPDATE
  english: 書き換えるために
  meaning: SELECT で読んだ行に鍵をかける。COMMIT か ROLLBACK まで、ほかの人の UPDATE・FOR UPDATE は待つ
  example: SELECT stock FROM products WHERE id = 28 FOR UPDATE
  level: 3
