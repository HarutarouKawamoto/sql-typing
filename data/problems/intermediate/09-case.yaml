# 中級9問目：CASE。値段で「高い・中くらい・安い」の帯を付ける
# 形：src/schema/problem-schema.js ／ 書き方：docs/development-guidelines.md の「問題データの書き方」
# 間違いの >= 2000 では、1000〜1999円の商品が low になる（結果が変わる）
id: intermediate-09
chapterId: intermediate
order: 9
title: 値段の帯を付けて
kind: normal
story:
  before:
    - speaker: eigyo
      text: カタログで、値段に帯を付けて色分けしたいの。
    - speaker: eigyo
      text: 5000円以上は high、1000円以上は middle、それ以外は low。
    - speaker: eigyo
      text: 名前・値段・帯を、高い順に。帯の列の名前は band で。
    - speaker: senpai
      text: 表計算の IF をいくつも重ねてたやつだな。
    - speaker: player
      text: 条件ごとに値を変えるのは CASE です。上から順に見ます。
  after:
    - speaker: eigyo
      text: high が4つ、middle が17ね。色分けが一発！
    - speaker: senpai
      text: IF の入れ子より、ずっと読みやすい……。
answer: SELECT name, price, CASE WHEN price >= 5000 THEN 'high' WHEN price >= 1000 THEN 'middle' ELSE 'low' END AS band FROM products ORDER BY price DESC
display: |-
  SELECT name, price,
    CASE
      WHEN price >= 5000 THEN 'high'
      WHEN price >= 1000 THEN 'middle'
      ELSE 'low'
    END AS band
  FROM products
  ORDER BY price DESC
blanks:
  - answer: WHEN price >= 1000 THEN 'middle'
    wrong:
      - text: WHEN price >= 2000 THEN 'middle'
        why: 2000 では、1000〜1999円の商品が low になる。依頼は1000円以上。
  - answer: ELSE 'low'
    wrong:
      - text: ELSE 'high'
        why: ELSE はどの WHEN にも合わなかった残り（1000円より安い商品）。low を付ける。
hints:
  - 使うのは SELECT・FROM・ORDER BY と、CASE・WHEN・THEN・ELSE・END。
  - 書く順は SELECT → FROM → ORDER BY。CASE は SELECT の中に書き、END AS band で名前を付ける。
  - SELECT ???, ???, CASE WHEN price >= ??? THEN 'high' WHEN price >= ??? THEN 'middle' ELSE ??? END AS band FROM ??? ORDER BY ??? DESC
judge:
  ordered: true
  checkColumnNames: true
keywords: [SELECT, CASE, WHEN, THEN, ELSE, END, AS, FROM, ORDER BY, DESC]
